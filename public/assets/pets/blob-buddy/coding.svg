<?xml version="1.0" encoding="UTF-8"?>
<!--
  Blob Buddy · coding pose — focused, faster bounce, "typing" hands.
  CC0 — drawn by hand for the Notchi project.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="body" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a3e1c0"/>
      <stop offset="100%" stop-color="#3fbf85"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.18)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>

  <ellipse cx="120" cy="200" rx="58" ry="9" fill="url(#shadow)">
    <animate attributeName="rx" values="58;54;58" dur="0.8s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -3; 0 0" dur="0.8s" repeatCount="indefinite"/>
    <ellipse cx="120" cy="130" rx="62" ry="58" fill="url(#body)" stroke="#268f5d" stroke-width="2"/>
    <!-- focused eyes (looking down at "screen") -->
    <ellipse cx="100" cy="125" rx="6" ry="6" fill="#0f3825"/>
    <ellipse cx="140" cy="125" rx="6" ry="6" fill="#0f3825"/>
    <circle cx="102" cy="123" r="1.6" fill="#fff"/>
    <circle cx="142" cy="123" r="1.6" fill="#fff"/>
    <!-- determined small mouth -->
    <line x1="115" y1="148" x2="125" y2="148" stroke="#0f3825" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- typing dots -->
  <g fill="#3fbf85">
    <circle cx="68" cy="190" r="3.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="0.6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="190" r="3.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="92" cy="190" r="3.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="0.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
