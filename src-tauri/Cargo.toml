[package]
name = "coding-pet"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "coding_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
    "tray-icon",
    "image-png",
    "macos-private-api",
] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
# NOTE: direct `rusqlite` is intentionally omitted in T1.1 because
# tauri-plugin-sql (sqlite feature) already links libsqlite3 via sqlx
# and Cargo forbids two crates linking the same native lib.
# See CHANGELOG.md (2026-05-05) for the deviation from SPEC §6.6.
rust_decimal = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSWindow",
    "NSResponder",
    "NSApplication",
    "NSRunningApplication",
    "NSScreen",
] }
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSGeometry",
    "objc2-core-foundation",
] }

